# The one hook mechanism in this repository.
#
#   make hooks                 install, once per clone
#   pre-commit run --all-files run every hook over the whole tree
#
# Needs the runner: brew install pre-commit, or pipx install pre-commit.

exclude: |
  (?x)^(
    book/book/|
    book/src/quiz/|
    book/theme/highlight\.js|
    wiki5000/|
    LICENSE-PROSE$
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=200]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.yaml]
        # The design notes are a record of a decision, not prose to be tidied.
        exclude: ^docs/

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: [--ignore-words=.codespellignore]
        exclude: \.toml$

  - repo: local
    hooks:
      # The repository's own rule — see AGENTS.md, "One sentence per line".
      - id: mdfmt
        name: markdown is one sentence per line
        entry: python3 scripts/mdfmt.py --check
        language: system
        types: [markdown]

      # The source book is copyrighted and paid for; neither it nor anything
      # extracted from it may ever be committed. .gitignore covers these too —
      # this is the second lock.
      - id: no-book-pdf
        name: refuse the book PDF and its extracts
        entry: this file must never be committed (see AGENTS.md, "Copyright")
        language: fail
        files: (?i)(\.pdf$|^pdf_.*\.txt$|seven-concurrency-models)
